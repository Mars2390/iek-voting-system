<!DOCTYPE html>
<html lang="en">
<head>
<script src="/theme-init.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/images/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/images/icon-180.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0a0a0a" />
<title>Log in — Engineer Hub</title>
<meta name="description" content="Log in to Engineer Hub with your IEK membership number." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="engineer-hub.css" />
<link rel="stylesheet" href="login.css" />
</head>
<body>

<div class="lg-page">
  <div class="lg-bg">
    <img src="images/landing/optimized/login-bg-harrun-muhammad-116282236-37198875.jpg" alt="" />
  </div>

  <div class="lg-card">
    <a href="/" class="eh-brand lg-brand">
      <span class="eh-brand-mark">
        <svg viewBox="0 0 32 32" width="22" height="22" role="img" aria-label="Engineer Hub logo">
          <defs>
            <linearGradient id="logo-grad" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#bb0a1e" />
              <stop offset="1" stop-color="#007a3d" />
            </linearGradient>
          </defs>
          <line x1="8" y1="24" x2="24" y2="8" stroke="url(#logo-grad)" stroke-width="2" />
          <line x1="8" y1="24" x2="24" y2="24" stroke="url(#logo-grad)" stroke-width="2" />
          <line x1="24" y1="8" x2="24" y2="24" stroke="url(#logo-grad)" stroke-width="2" />
          <circle cx="8" cy="24" r="4" fill="#101a24" />
          <circle cx="24" cy="8" r="4" fill="url(#logo-grad)" />
          <circle cx="24" cy="24" r="4" fill="url(#logo-grad)" />
        </svg>
      </span>
      <span class="eh-brand-text">
        <span class="name">Engineer<em>Hub</em></span>
        <span class="tag">Institution of Engineers of Kenya — Network</span>
      </span>
    </a>

    <h1>Log in</h1>
    <p class="lg-sub" id="lg-sub">Use your IEK membership number and PIN.</p>

    <form id="lg-form" novalidate>
      <label class="lg-field" id="lg-name-group">
        <span>Full name</span>
        <input type="text" name="displayName" id="lg-name" placeholder="e.g. Eng. Jane Wanjiru" autocomplete="name" required />
      </label>

      <label class="lg-field" id="lg-number-group">
        <span>Membership number</span>
        <input type="text" name="membershipNumber" id="lg-number" placeholder="e.g. M.1234" autocomplete="username" inputmode="numeric" required />
        <small>Any format works — M.1234, M1234, or just 1234.</small>
      </label>

      <label class="lg-field" id="lg-pin-group" hidden>
        <span id="lg-pin-label">PIN</span>
        <input type="password" name="pin" id="lg-pin" placeholder="4-6 digit PIN" autocomplete="current-password" inputmode="numeric" maxlength="6" />
        <small id="lg-pin-hint"></small>
      </label>

      <label class="lg-field" id="lg-pin-confirm-group" hidden>
        <span>Confirm PIN</span>
        <input type="password" id="lg-pin-confirm" placeholder="Re-enter PIN" autocomplete="new-password" inputmode="numeric" maxlength="6" />
      </label>

      <div id="lg-error" class="lg-error" hidden></div>

      <button type="submit" id="lg-submit" class="eh-btn eh-btn-primary lg-submit">
        <span class="lg-submit-label">Continue</span>
      </button>
    </form>

    <p class="lg-foot">Not registered with IEK yet? Engineer Hub logins are for members already in the official register.</p>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
