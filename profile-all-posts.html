<!DOCTYPE html>
<html lang="en">
<head>
<script src="/theme-init.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/images/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/images/icon-180.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0a0a0a" />
<title>Posts — Engineer Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="engineer-hub.css" />
<link rel="stylesheet" href="dashboard.css" />
<link rel="stylesheet" href="hub.css" />
<link rel="stylesheet" href="feed-shared.css" />
</head>
<body>

<div id="app-nav" data-active="home"></div>

<main class="hub-main" style="max-width: 640px;">
  <a id="pap-back-link" href="/profile.html" class="pf-edit-link" style="display:inline-block;margin-bottom:14px;">&larr; Back to profile</a>
  <div id="pap-head" class="hub-card" style="margin-bottom:20px;display:flex;align-items:center;gap:14px;">
    <span id="pap-avatar"></span>
    <div>
      <h1 id="pap-name" style="margin:0;font-size:18px;font-weight:800;font-family:var(--font-display);"></h1>
      <p id="pap-count" style="margin:2px 0 0;font-size:13px;color:var(--ink-muted);"></p>
    </div>
  </div>

  <div id="pap-posts-list" class="feed-posts"></div>
  <div style="text-align:center;margin-top:16px;">
    <button id="pap-loadmore" class="eh-btn eh-btn-ghost-light hub-btn-sm" hidden>Load more</button>
  </div>
</main>

<div id="app-footer"></div>

<script src="hub-common.js"></script>
<script src="app-nav.js"></script>
<script src="app-footer.js"></script>
<script src="post-shared.js"></script>
<script src="profile-all-posts.js"></script>
</body>
</html>
