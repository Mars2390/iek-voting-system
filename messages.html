<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/images/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/images/icon-180.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0a0a0a" />
<title>Messages — Engineer Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="engineer-hub.css" />
<link rel="stylesheet" href="dashboard.css" />
<link rel="stylesheet" href="hub.css" />
<link rel="stylesheet" href="messages.css" />
</head>
<body>

<div id="app-nav" data-active="messages"></div>

<main class="msg-shell">
  <aside class="msg-inbox">
    <div class="msg-inbox-head">
      <h1>Messages</h1>
      <input type="text" id="msg-search" placeholder="Search conversations…" />
      <div class="msg-filter-pills">
        <button type="button" class="msg-filter-pill is-active" data-filter="all">All</button>
        <button type="button" class="msg-filter-pill" data-filter="unread">Unread</button>
        <button type="button" class="msg-filter-pill" data-filter="starred">Starred</button>
      </div>
    </div>
    <div id="msg-conv-list" class="msg-conv-list">
      <div class="hub-loading">Loading…</div>
    </div>
  </aside>

  <section class="msg-thread" id="msg-thread">
    <div class="msg-thread-empty" id="msg-thread-empty">
      <p>Select a conversation to start messaging.</p>
      <p class="hint">You can only message engineers you're connected with.</p>
    </div>

    <div class="msg-thread-active" id="msg-thread-active" hidden>
      <div class="msg-thread-head">
        <button type="button" id="msg-back-btn" class="msg-back-btn" aria-label="Back to conversations">&larr;</button>
        <a id="msg-thread-avatar-link" href="#"><span id="msg-thread-avatar"></span></a>
        <div>
          <a id="msg-thread-name-link" href="#" class="msg-thread-name-link"><h2 id="msg-thread-name"></h2></a>
          <p id="msg-thread-role" class="msg-thread-role"></p>
          <p id="msg-thread-presence" class="msg-thread-presence" hidden></p>
        </div>
      </div>
      <div id="msg-thread-body" class="msg-thread-body"></div>
      <div id="msg-typing-indicator" class="msg-typing-indicator" hidden><span></span><span></span><span></span></div>

      <div id="msg-attachment-preview" class="msg-attachment-preview" hidden></div>

      <div id="msg-voice-recorder" class="msg-voice-recorder" hidden>
        <span class="msg-voice-rec-dot"></span>
        <span id="msg-voice-rec-timer">0:00</span>
        <span class="msg-voice-rec-label">Recording voice message…</span>
        <button type="button" id="msg-voice-cancel" class="eh-btn eh-btn-ghost-light hub-btn-sm">Cancel</button>
        <button type="button" id="msg-voice-stop" class="eh-btn eh-btn-primary hub-btn-sm">Stop &amp; send</button>
      </div>

      <form id="msg-send-form" class="msg-send-form">
        <label class="msg-attach-btn" aria-label="Send a photo" title="Photo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2" /><circle cx="8.5" cy="10.5" r="1.5" /><path d="M21 15l-5-5-9 9" /></svg>
          <input type="file" id="msg-image-input" accept="image/*" hidden />
        </label>
        <label class="msg-attach-btn" aria-label="Attach a file" title="Attach file">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" /></svg>
          <input type="file" id="msg-file-input" hidden />
        </label>
        <button type="button" id="msg-voice-btn" class="msg-attach-btn" aria-label="Record a voice message" title="Voice message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 003-3V6a3 3 0 00-6 0v6a3 3 0 003 3z" /><path d="M19 11a7 7 0 01-14 0M12 18v3" /></svg>
        </button>
        <textarea id="msg-input" placeholder="Write a message…" rows="1" maxlength="4000"></textarea>
        <button type="submit" id="msg-send-btn" class="eh-btn eh-btn-primary hub-btn-sm">Send</button>
      </form>
    </div>
  </section>
</main>

<div id="app-footer"></div>

<script src="hub-common.js"></script>
<script src="app-nav.js"></script>
<script src="app-footer.js"></script>
<script src="messages.js"></script>
</body>
</html>
