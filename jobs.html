<!DOCTYPE html>
<html lang="en">
<head>
<script src="/theme-init.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/images/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/images/icon-180.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0a0a0a" />
<title>Jobs — Engineer Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="engineer-hub.css" />
<link rel="stylesheet" href="dashboard.css" />
<link rel="stylesheet" href="hub.css" />
</head>
<body>

<div id="app-nav" data-active="jobs"></div>

<section class="hub-banner">
  <img src="images/landing/optimized/pexels-e-g-439660199-29155807.jpg" alt="" />
  <div class="hub-banner-inner">
    <span class="eh-eyebrow">Opportunities</span>
    <h1>Jobs</h1>
    <p>Openings shared by fellow engineers — posted by members, for members.</p>
  </div>
</section>

<main class="hub-main">
  <div class="hub-tabs">
    <button class="hub-tab is-active" data-jobtab="browse">Browse jobs</button>
    <button class="hub-tab" data-jobtab="mine">My postings <span id="jobs-mine-count"></span></button>
  </div>

  <div id="jobs-browse-panel">
    <div class="hub-filterbar">
      <input type="text" id="jobs-search" placeholder="Search by title or company…" />
      <select id="jobs-discipline"><option value="">All disciplines</option></select>
      <select id="jobs-type">
        <option value="">All types</option>
        <option>Full-time</option>
        <option>Internship</option>
        <option>Contract</option>
        <option>Part-time</option>
      </select>
      <input type="text" id="jobs-location" placeholder="Location…" style="max-width:160px;" />
      <button id="jobs-post-btn" class="eh-btn eh-btn-primary hub-btn-sm">+ Post a job</button>
    </div>
  </div>
  <div id="jobs-mine-panel" hidden></div>

  <form id="jobs-form" class="hub-card" hidden style="margin-bottom:24px;">
    <h2 style="margin:0 0 16px;font-size:16px;">Post a job</h2>
    <div class="pf-form-row">
      <label class="lg-field"><span>Job title</span><input type="text" id="job-title" required /></label>
      <label class="lg-field"><span>Company</span><input type="text" id="job-company" required /></label>
    </div>
    <div class="pf-form-row">
      <label class="lg-field"><span>Location</span><input type="text" id="job-location" placeholder="e.g. Nairobi, Remote" /></label>
      <label class="lg-field"><span>Job type</span>
        <select id="job-type">
          <option value="">Select…</option>
          <option>Full-time</option>
          <option>Internship</option>
          <option>Contract</option>
          <option>Part-time</option>
        </select>
      </label>
    </div>
    <label class="lg-field"><span>Discipline</span><input type="text" id="job-discipline" placeholder="e.g. Electrical Engineering" /></label>
    <div class="pf-form-row">
      <label class="lg-field"><span>Salary min (KES/month, optional)</span><input type="number" id="job-salary-min" min="0" /></label>
      <label class="lg-field"><span>Salary max (KES/month, optional)</span><input type="number" id="job-salary-max" min="0" /></label>
    </div>
    <label class="lg-field"><span>Description</span><textarea id="job-description" rows="4" required style="width:100%;font-family:var(--font-body);font-size:14px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--ink);"></textarea></label>
    <div class="pf-form-row">
      <label class="lg-field"><span>Apply URL</span><input type="url" id="job-apply-url" placeholder="https://…" /></label>
      <label class="lg-field"><span>Or apply email</span><input type="email" id="job-apply-email" /></label>
    </div>
    <div id="jobs-form-error" class="lg-error" hidden></div>
    <div class="pf-form-actions">
      <button type="submit" class="eh-btn eh-btn-primary">Post job</button>
      <button type="button" id="jobs-form-cancel" class="eh-btn eh-btn-ghost-light">Cancel</button>
    </div>
  </form>

  <div id="jobs-list" class="hub-list"></div>
</main>

<div id="app-footer"></div>

<script src="hub-common.js"></script>
<script src="app-nav.js"></script>
<script src="app-footer.js"></script>
<script src="jobs.js"></script>
</body>
</html>
