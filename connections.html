<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connections — Engineer Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="engineer-hub.css" />
<link rel="stylesheet" href="dashboard.css" />
<link rel="stylesheet" href="hub.css" />
</head>
<body>

<div id="app-nav" data-active="network"></div>

<section class="hub-banner">
  <img src="images/landing/optimized/pexels-mikael-blomkvist-8961146.jpg" alt="" />
  <div class="hub-banner-inner">
    <span class="eh-eyebrow">Your network</span>
    <h1>My Network</h1>
    <p>People you know, requests waiting on you, and <a href="/directory.html" style="color:#fff;text-decoration:underline;">the full directory</a> when you're ready to grow it.</p>
  </div>
</section>

<main class="hub-main">
  <div class="db-stat-row" style="margin-top:0;margin-bottom:24px;">
    <div class="hub-card db-stat-card"><span class="db-stat-num" id="net-stat-connections">0</span><span class="db-stat-label">Connections</span></div>
    <div class="hub-card db-stat-card"><span class="db-stat-num" id="net-stat-incoming">0</span><span class="db-stat-label">Invitations received</span></div>
    <div class="hub-card db-stat-card"><span class="db-stat-num" id="net-stat-outgoing">0</span><span class="db-stat-label">Requests sent</span></div>
  </div>

  <div class="hub-tabs">
    <button class="hub-tab is-active" data-tab="connections">My Connections <span id="tab-count-connections"></span></button>
    <button class="hub-tab" data-tab="incoming">Invitations <span id="tab-count-incoming"></span></button>
    <button class="hub-tab" data-tab="outgoing">Pending <span id="tab-count-outgoing"></span></button>
    <button class="hub-tab" data-tab="following">Following <span id="tab-count-following"></span></button>
    <button class="hub-tab" data-tab="followers">Followers <span id="tab-count-followers"></span></button>
  </div>

  <div id="panel-connections" class="hub-card"><div class="hub-loading">Loading…</div></div>
  <div id="panel-incoming" class="hub-card" hidden></div>
  <div id="panel-outgoing" class="hub-card" hidden></div>
  <div id="panel-following" class="hub-card" hidden></div>
  <div id="panel-followers" class="hub-card" hidden></div>
</main>

<script src="hub-common.js"></script>
<script src="app-nav.js"></script>
<script src="connections.js"></script>
</body>
</html>
