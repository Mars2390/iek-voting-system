<!DOCTYPE html>
<html lang="en">
<head>
<script src="/theme-init.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/images/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/images/icon-180.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0a0a0a" />
<title>Voting — Engineer Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="engineer-hub.css" />
<link rel="stylesheet" href="dashboard.css" />
<link rel="stylesheet" href="hub.css" />
<link rel="stylesheet" href="profile.css" />
<link rel="stylesheet" href="elections.css" />
</head>
<body>

<div id="app-nav" data-active="voting"></div>

<section class="hub-banner">
  <img src="images/landing/optimized/pexels-e-g-439660199-29155807.jpg" alt="" />
  <div class="hub-banner-inner">
    <span class="eh-eyebrow">Institution of Engineers of Kenya</span>
    <h1>Voting</h1>
    <p>Launch your campaign, reach fellow engineers, cast your vote, and watch the results live.</p>
  </div>
</section>

<main class="vt-page">
  <div id="vt-loading" class="hub-loading">Loading elections…</div>

  <div id="vt-content" hidden>
    <section id="vt-status" class="vt-status"></section>

    <div class="vt-actions">
      <button type="button" class="vt-action" id="vt-act-vote">
        <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4" /><rect x="3" y="4" width="18" height="16" rx="2" /></svg></span>
        <span>Vote now<small>Choose your candidates on the ballot</small></span>
      </button>
      <button type="button" class="vt-action" id="vt-act-create">
        <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-7-7 18-2-8-9-3z" /></svg></span>
        <span>Create my campaign<small>Run for a position and reach voters</small></span>
      </button>
      <a class="vt-action" id="vt-act-results" href="/results.html">
        <span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg></span>
        <span>Live results<small>Real-time counts and turnout</small></span>
      </a>
    </div>

    <div class="hub-tabs">
      <button class="hub-tab is-active" data-vtab="ballot">Ballot</button>
      <button class="hub-tab" data-vtab="campaigns">All campaigns <span id="vt-tab-campaign-count"></span></button>
      <button class="hub-tab" data-vtab="results">Live results</button>
      <button class="hub-tab" data-vtab="mine">My campaigns <span id="vt-tab-mine-count"></span></button>
    </div>

    <div id="vt-panel-ballot"></div>
    <div id="vt-panel-campaigns" hidden></div>
    <div id="vt-panel-results" hidden></div>
    <div id="vt-panel-mine" hidden></div>
  </div>
</main>

<div id="app-footer"></div>

<script src="hub-common.js"></script>
<script src="app-nav.js"></script>
<script src="app-footer.js"></script>
<script src="election-shared.js"></script>
<script src="elections.js"></script>
</body>
</html>
