<!DOCTYPE html>
<html lang="en">
<head>
<script src="/theme-init.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/images/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/images/icon-180.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0a0a0a" />
<title>Profile — Engineer Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="engineer-hub.css" />
<link rel="stylesheet" href="dashboard.css" />
<link rel="stylesheet" href="hub.css" />
<link rel="stylesheet" href="feed-shared.css" />
<link rel="stylesheet" href="profile.css" />
</head>
<body>

<div id="app-nav" data-active="me"></div>

<main class="hub-page" id="pf-loading-wrap">
  <div class="hub-loading">Loading profile…</div>
</main>

<main class="hub-page" id="pf-content" hidden>
  <div class="pf-cover" id="pf-cover">
    <img id="pf-cover-img" src="" alt="" hidden />
    <button id="pf-cover-edit" class="pf-cover-edit-btn" type="button" hidden>Change cover</button>
    <input id="pf-cover-input" type="file" accept="image/*" hidden />
  </div>

  <div class="hub-main pf-header">
    <div class="pf-avatar-wrap">
      <span id="pf-avatar" class="hub-avatar sz-xl"></span>
      <button id="pf-avatar-edit" class="pf-avatar-edit-btn" type="button" hidden aria-label="Change profile photo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h4l2-3h4l2 3h4v13H4V7z" /><circle cx="12" cy="13" r="4" /></svg>
      </button>
      <input id="pf-avatar-input" type="file" accept="image/*" hidden />
    </div>

    <div class="pf-header-info">
      <div class="pf-header-top">
        <div>
          <h1 id="pf-name">—</h1>
          <p id="pf-title" class="pf-title"></p>
          <p class="pf-meta">
            <span class="hub-verified-badge">Verified<span id="pf-iek-wrap" hidden> — <span id="pf-iek"></span></span></span>
            <span id="pf-location-company"></span>
            <a href="#" id="pf-connections-count" class="pf-connections-link"></a>
            <a href="#" id="pf-followers-count" class="pf-connections-link"></a>
            <span id="pf-open-to-work-badge" class="pf-otw-badge" hidden>Open to work</span>
          </p>
        </div>
        <div class="pf-header-actions" id="pf-header-actions"></div>
      </div>
    </div>
  </div>

  <div class="hub-main pf-nudges" id="pf-nudges" hidden></div>

  <div class="hub-main pf-grid">
    <div class="pf-col-main">

      <section class="hub-card pf-section" id="pf-posts-section" hidden>
        <div class="pf-section-head">
          <h2>Posts</h2>
          <a id="pf-posts-showall" class="pf-edit-link" href="#">Show all</a>
        </div>
        <div class="pf-posts-carousel-wrap">
          <button type="button" id="pf-posts-prev" class="pf-posts-nav prev" aria-label="Previous" hidden>&#10094;</button>
          <div id="pf-posts-list" class="pf-posts-carousel"></div>
          <button type="button" id="pf-posts-next" class="pf-posts-nav next" aria-label="Next" hidden>&#10095;</button>
        </div>
      </section>

      <section class="hub-card pf-section">
        <div class="pf-section-head">
          <h2>About</h2>
          <button id="pf-about-edit-btn" class="pf-edit-link" type="button" hidden>Edit</button>
        </div>
        <p id="pf-bio-view" class="pf-bio">—</p>
      </section>

      <div class="hub-modal-overlay pf-form-modal-overlay" id="pf-about-modal" hidden>
        <div class="hub-modal pf-form-modal">
          <div class="hub-modal-head"><h3>Edit About</h3><button type="button" class="hub-modal-close" data-modal-close aria-label="Close">&times;</button></div>
          <form id="pf-about-form" class="hub-modal-body pf-form-modal-body">
            <label class="lg-field">
              <span>Bio</span>
              <textarea id="pf-input-bio" rows="4" class="pf-form-textarea"></textarea>
            </label>
            <div class="pf-form-actions">
              <button type="button" class="eh-btn eh-btn-ghost-light pf-form-btn pf-cancel">Cancel</button>
              <button type="submit" class="eh-btn eh-btn-save pf-form-btn">Save changes</button>
            </div>
          </form>
        </div>
      </div>

      <section class="hub-card pf-section">
        <div class="pf-section-head">
          <h2>Experience</h2>
          <button id="pf-exp-add-btn" class="pf-edit-link" type="button" hidden>+ Add</button>
        </div>
        <div id="pf-exp-list" class="pf-entry-list"></div>
      </section>

      <div class="hub-modal-overlay pf-form-modal-overlay" id="pf-exp-modal" hidden>
        <div class="hub-modal pf-form-modal">
          <div class="hub-modal-head"><h3 id="pf-exp-modal-title">Add Experience</h3><button type="button" class="hub-modal-close" data-modal-close aria-label="Close">&times;</button></div>
          <form id="pf-exp-form" class="hub-modal-body pf-form-modal-body">
            <input type="hidden" id="pf-exp-id" />
            <label class="lg-field"><span>Job title</span><input type="text" id="pf-exp-title" required /></label>
            <label class="lg-field"><span>Company</span><input type="text" id="pf-exp-company" required /></label>
            <div class="pf-form-row">
              <label class="lg-field"><span>Start date</span><input type="date" id="pf-exp-start" /></label>
              <label class="lg-field"><span>End date</span><input type="date" id="pf-exp-end" /></label>
            </div>
            <label class="pf-checkbox"><input type="checkbox" id="pf-exp-current" /> I currently work here</label>
            <label class="lg-field"><span>Description</span><textarea id="pf-exp-desc" rows="3" class="pf-form-textarea"></textarea></label>
            <div class="pf-form-actions">
              <button type="button" class="eh-btn eh-btn-ghost-light pf-form-btn pf-cancel">Cancel</button>
              <button type="submit" class="eh-btn eh-btn-save pf-form-btn">Save changes</button>
            </div>
          </form>
        </div>
      </div>

      <section class="hub-card pf-section">
        <div class="pf-section-head">
          <h2>Education</h2>
          <button id="pf-edu-add-btn" class="pf-edit-link" type="button" hidden>+ Add</button>
        </div>
        <div id="pf-edu-list" class="pf-entry-list"></div>
      </section>

      <div class="hub-modal-overlay pf-form-modal-overlay" id="pf-edu-modal" hidden>
        <div class="hub-modal pf-form-modal">
          <div class="hub-modal-head"><h3 id="pf-edu-modal-title">Add Education</h3><button type="button" class="hub-modal-close" data-modal-close aria-label="Close">&times;</button></div>
          <form id="pf-edu-form" class="hub-modal-body pf-form-modal-body">
            <input type="hidden" id="pf-edu-id" />
            <label class="lg-field"><span>Institution</span><input type="text" id="pf-edu-institution" required /></label>
            <label class="lg-field"><span>Degree</span><input type="text" id="pf-edu-degree" required /></label>
            <label class="lg-field"><span>Field of study</span><input type="text" id="pf-edu-field" /></label>
            <div class="pf-form-row">
              <label class="lg-field"><span>Start year</span><input type="number" id="pf-edu-start" min="1950" max="2100" /></label>
              <label class="lg-field"><span>End year</span><input type="number" id="pf-edu-end" min="1950" max="2100" /></label>
            </div>
            <div class="pf-form-actions">
              <button type="button" class="eh-btn eh-btn-ghost-light pf-form-btn pf-cancel">Cancel</button>
              <button type="submit" class="eh-btn eh-btn-save pf-form-btn">Save changes</button>
            </div>
          </form>
        </div>
      </div>

      <section class="hub-card pf-section">
        <h2>Skills</h2>
        <div id="pf-skills-list" class="pf-skills"></div>
        <form id="pf-skill-form" class="pf-skill-form" hidden>
          <input type="text" id="pf-skill-input" placeholder="e.g. Structural Design" maxlength="80" />
          <button type="submit" class="eh-btn eh-btn-primary hub-btn-sm">Add</button>
        </form>
      </section>

    </div>

    <aside class="pf-col-side">
      <section class="hub-card pf-section" id="pf-views-card" hidden>
        <div class="pf-section-head">
          <h2>Who viewed your profile</h2>
        </div>
        <p class="pf-views-count" id="pf-views-count"></p>
        <div id="pf-views-list" class="pf-views-list"></div>
      </section>

      <section class="hub-card pf-section">
        <div class="pf-section-head">
          <h2>Contact</h2>
          <button id="pf-contact-edit-btn" class="pf-edit-link" type="button" hidden>Edit</button>
        </div>
        <dl id="pf-contact-view" class="pf-contact-list"></dl>
      </section>

      <div class="hub-modal-overlay pf-form-modal-overlay" id="pf-contact-modal" hidden>
        <div class="hub-modal pf-form-modal">
          <div class="hub-modal-head"><h3>Edit Contact</h3><button type="button" class="hub-modal-close" data-modal-close aria-label="Close">&times;</button></div>
          <form id="pf-contact-form" class="hub-modal-body pf-form-modal-body" novalidate>
            <label class="lg-field"><span>Email (required)</span><input type="email" id="pf-input-email" required /></label>
            <label class="lg-field"><span>LinkedIn URL</span><input type="url" id="pf-input-linkedin" /></label>
            <label class="lg-field"><span>GitHub URL</span><input type="url" id="pf-input-github" /></label>
            <label class="lg-field"><span>Portfolio URL</span><input type="url" id="pf-input-portfolio" /></label>
            <div id="pf-contact-error" class="lg-error" hidden></div>
            <div class="pf-form-actions">
              <button type="button" class="eh-btn eh-btn-ghost-light pf-form-btn pf-cancel">Cancel</button>
              <button type="submit" class="eh-btn eh-btn-save pf-form-btn">Save changes</button>
            </div>
          </form>
        </div>
      </div>

      <section class="hub-card pf-section" id="pf-details-card">
        <div class="pf-section-head">
          <h2>Details</h2>
          <button id="pf-details-edit-btn" class="pf-edit-link" type="button" hidden>Edit</button>
        </div>
        <dl id="pf-details-view" class="pf-contact-list"></dl>
        <div class="pf-otw-toggle-row" id="pf-otw-row" hidden>
          <span>Open to work</span>
          <label class="pf-switch">
            <input type="checkbox" id="pf-otw-toggle" />
            <span class="track"></span>
          </label>
        </div>
      </section>

      <div class="hub-modal-overlay pf-form-modal-overlay" id="pf-details-modal" hidden>
        <div class="hub-modal pf-form-modal">
          <div class="hub-modal-head"><h3>Edit Details</h3><button type="button" class="hub-modal-close" data-modal-close aria-label="Close">&times;</button></div>
          <form id="pf-details-form" class="hub-modal-body pf-form-modal-body">
            <label class="lg-field"><span>Full name</span><input type="text" id="pf-input-name" /></label>
            <label class="lg-field"><span>Title</span><input type="text" id="pf-input-title" placeholder="e.g. Civil Engineer" /></label>
            <label class="lg-field">
              <span>Discipline</span>
              <select id="pf-input-discipline">
                <option value="">Select a discipline…</option>
                <option>Civil Engineering</option>
                <option>Structural Engineering</option>
                <option>Electrical Engineering</option>
                <option>Mechanical Engineering</option>
                <option>Chemical Engineering</option>
                <option>Environmental Engineering</option>
                <option>Water Engineering</option>
                <option>Geotechnical Engineering</option>
                <option>Mining Engineering</option>
                <option>Agricultural & Biosystems Engineering</option>
                <option>Industrial & Textile Engineering</option>
                <option>Marine Engineering</option>
                <option>Aeronautical Engineering</option>
                <option>Petroleum Engineering</option>
                <option>Biomedical Engineering</option>
                <option>Computer / Software Engineering</option>
                <option>Telecommunication Engineering</option>
                <option>Other</option>
              </select>
            </label>
            <label class="lg-field"><span>Company</span><input type="text" id="pf-input-company" /></label>
            <label class="lg-field"><span>Location</span><input type="text" id="pf-input-location" /></label>
            <label class="lg-field"><span>Years of experience</span><input type="number" id="pf-input-years" min="0" max="70" /></label>
            <div class="pf-form-actions">
              <button type="button" class="eh-btn eh-btn-ghost-light pf-form-btn pf-cancel">Cancel</button>
              <button type="submit" class="eh-btn eh-btn-save pf-form-btn">Save changes</button>
            </div>
          </form>
        </div>
      </div>
    </aside>
  </div>
</main>

<div id="app-footer"></div>

<script src="hub-common.js"></script>
<script src="app-nav.js"></script>
<script src="app-footer.js"></script>
<script src="post-shared.js"></script>
<script src="profile-posts.js"></script>
<script src="profile.js"></script>
</body>
</html>
